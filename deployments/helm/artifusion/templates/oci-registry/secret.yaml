{{- $hasCredentials := or .Values.secrets.github.token .Values.secrets.dockerhub.token .Values.secrets.ociUpstreams }}
{{- if and .Values.ociRegistry.enabled $hasCredentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "artifusion.ociRegistry.serviceName" . }}-creds
  labels:
    {{- include "artifusion.ociRegistry.labels" . | nindent 4 }}
type: Opaque
stringData:
  credentials: |
    {{- $creds := dict }}
    {{- if .Values.secrets.github.token }}
    {{- $_ := set $creds "ghcr.io" (dict "username" .Values.secrets.github.username "password" .Values.secrets.github.token) }}
    {{- end }}
    {{- if .Values.secrets.dockerhub.token }}
    {{- $_ := set $creds "docker.io" (dict "username" .Values.secrets.dockerhub.username "password" .Values.secrets.dockerhub.token) }}
    {{- end }}
    {{- range $namespace, $credential := .Values.secrets.ociUpstreams }}
    {{- $_ := set $creds $namespace (dict "username" $credential.username "password" (default $credential.token $credential.password)) }}
    {{- end }}
    {{ toJson $creds }}
{{- end }}
